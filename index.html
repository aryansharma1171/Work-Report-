<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etho x Arya ai img resolution Changer</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F3F4F6;
            --surface: #FFFFFF;
            --text: #1F2937;
            --text-light: #6B7280;
            --border: #D1D5DB;
            --error: #EF4444;
            --error-hover: #DC2626;
            --success: #10B981;
            --radius: 8px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --zone-bg: #F9FAFB;
            --zone-hover: #EEF2FF;
            --input-bg: #FFFFFF;
        }

        body.dark-mode {
            --bg: #111827;
            --surface: #1F2937;
            --text: #F9FAFB;
            --text-light: #9CA3AF;
            --border: #374151;
            --zone-bg: #111827;
            --zone-hover: #374151;
            --input-bg: #111827;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            background-color: var(--surface);
            max-width: 800px;
            width: 100%;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 30px;
            transition: background-color 0.3s;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--text);
            margin: 0;
        }

        .error-message {
            background-color: #FEE2E2;
            color: #B91C1C;
            padding: 10px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            text-align: center;
            display: none;
            font-weight: 500;
        }

        body.dark-mode .error-message {
            background-color: #7F1D1D;
            color: #FECACA;
        }

        /* Drag and Drop Zone */
        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: var(--zone-bg);
        }

        .upload-zone:hover, .upload-zone.dragover {
            border-color: var(--primary);
            background-color: var(--zone-hover);
        }

        .upload-zone p {
            color: var(--text-light);
            margin-bottom: 10px;
        }

        input[type="file"] {
            display: none;
        }

        .workspace {
            display: none;
            margin-top: 30px;
        }

        /* Previews */
        .preview-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--zone-bg);
            position: relative;
        }

        .preview-image {
            max-width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .dimensions-text {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        /* Controls */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .controls-grid {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.9rem;
            margin-bottom: 5px;
            font-weight: 500;
            color: var(--text);
        }

        input[type="number"], select, input[type="range"] {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            outline: none;
            background-color: var(--input-bg);
            color: var(--text);
            transition: border-color 0.3s ease, background-color 0.3s;
        }

        input[type="number"]:focus, select:focus {
            border-color: var(--primary);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            grid-column: 1 / -1;
            margin-bottom: 10px;
        }

        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
        }

        /* Buttons */
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            width: 100%;
            transition: background-color 0.3s ease;
            margin-bottom: 10px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-success {
            background-color: var(--success);
        }

        .btn-success:hover {
            background-color: #059669;
        }
        
        .btn-danger {
            background-color: var(--error);
            width: auto;
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        .btn-danger:hover {
            background-color: var(--error-hover);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            width: auto;
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        .btn-secondary:hover {
            background-color: var(--zone-hover);
            color: var(--text);
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .result-area {
            display: none;
            margin-top: 30px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-container">
        <h1>Etho x Arya ai img resolution Changer</h1>
        <button class="btn btn-secondary" id="themeToggle" style="margin-bottom: 0;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="themeIcon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            <span id="themeText" style="margin-left: 5px;">Dark Mode</span>
        </button>
    </div>
    
    <div id="errorMessage" class="error-message"></div>

    <div class="upload-zone" id="dropZone">
        <p>Drag & Drop an image here or</p>
        <button class="btn" style="width: auto;" onclick="document.getElementById('fileInput').click()">Browse Files</button>
        <p style="font-size: 0.8rem; margin-top: 10px;">Supported formats: JPG, PNG, WEBP</p>
        <input type="file" id="fileInput" accept="image/jpeg, image/png, image/webp">
    </div>

    <div class="workspace" id="workspace">
        <div class="preview-container">
            <img id="originalPreview" class="preview-image" alt="Original Image">
            <span class="dimensions-text" id="originalDimensions"></span>
            <button class="btn btn-danger" id="removeBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                Remove Image
            </button>
        </div>

        <div class="controls-grid">
            <div class="input-group">
                <label for="widthInput">Width (px)</label>
                <input type="number" id="widthInput" min="1">
            </div>
            
            <div class="input-group">
                <label for="heightInput">Height (px)</label>
                <input type="number" id="heightInput" min="1">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="aspectCheckbox" checked>
                <label for="aspectCheckbox" style="margin: 0;">Maintain Aspect Ratio</label>
            </div>

            <div class="input-group">
                <label for="formatSelect">Output Format</label>
                <select id="formatSelect">
                    <option value="image/png">PNG</option>
                    <option value="image/jpeg">JPG</option>
                    <option value="image/webp">WEBP</option>
                </select>
            </div>

            <div class="input-group" id="qualityGroup" style="display: none;">
                <label for="qualitySlider">Image Quality (JPG/WEBP): <span id="qualityValue">0.9</span></label>
                <input type="range" id="qualitySlider" min="0.1" max="1" step="0.1" value="0.9">
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn" id="resizeBtn">Resize Image</button>
            <button class="btn btn-secondary" id="resetBtn" style="width: auto;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
                Reset Values
            </button>
        </div>

        <div class="result-area" id="resultArea">
            <h3 style="margin-bottom: 15px; text-align: center;">Resized Result</h3>
            <div class="preview-container">
                <img id="resizedPreview" class="preview-image" alt="Resized Image">
                <span class="dimensions-text" id="resizedDimensions"></span>
            </div>
            <button class="btn btn-success" id="downloadBtn">Download Image</button>
        </div>
    </div>
</div>

<script>
    // Elements
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const workspace = document.getElementById('workspace');
    const errorMessage = document.getElementById('errorMessage');
    
    const originalPreview = document.getElementById('originalPreview');
    const originalDimensions = document.getElementById('originalDimensions');
    const removeBtn = document.getElementById('removeBtn');
    const resetBtn = document.getElementById('resetBtn');
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const themeText = document.getElementById('themeText');
    
    const widthInput = document.getElementById('widthInput');
    const heightInput = document.getElementById('heightInput');
    const aspectCheckbox = document.getElementById('aspectCheckbox');
    
    const formatSelect = document.getElementById('formatSelect');
    const qualityGroup = document.getElementById('qualityGroup');
    const qualitySlider = document.getElementById('qualitySlider');
    const qualityValue = document.getElementById('qualityValue');
    
    const resizeBtn = document.getElementById('resizeBtn');
    const resultArea = document.getElementById('resultArea');
    const resizedPreview = document.getElementById('resizedPreview');
    const resizedDimensions = document.getElementById('resizedDimensions');
    const downloadBtn = document.getElementById('downloadBtn');

    // State
    let originalImage = new Image();
    let originalWidth = 0;
    let originalHeight = 0;
    let currentFileName = "image";
    let resizedDataUrl = "";
    let isDarkMode = false;

    // Utilities
    const showError = (msg) => {
        errorMessage.textContent = msg;
        errorMessage.style.display = 'block';
        setTimeout(() => errorMessage.style.display = 'none', 5000);
    };

    // Theme Toggle Handler
    themeToggle.addEventListener('click', () => {
        isDarkMode = !isDarkMode;
        document.body.classList.toggle('dark-mode', isDarkMode);
        
        if (isDarkMode) {
            themeText.textContent = 'Light Mode';
            themeIcon.innerHTML = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
        } else {
            themeText.textContent = 'Dark Mode';
            themeIcon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
        }
    });

    // Drag and Drop Handlers
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length) {
            handleFile(e.dataTransfer.files[0]);
        }
    });

    // File Input Handler
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) {
            handleFile(e.target.files[0]);
        }
    });

    // File Processing
    function handleFile(file) {
        const validTypes = ['image/jpeg', 'image/png', 'image/webp'];
        if (!validTypes.includes(file.type)) {
            showError('Invalid file type. Please upload a JPG, PNG, or WEBP image.');
            return;
        }

        currentFileName = file.name.split('.')[0];
        const reader = new FileReader();
        
        reader.onload = (e) => {
            originalImage.src = e.target.result;
            originalImage.onload = () => {
                originalWidth = originalImage.width;
                originalHeight = originalImage.height;
                
                originalPreview.src = originalImage.src;
                originalDimensions.textContent = `Original: ${originalWidth} × ${originalHeight} px`;
                
                widthInput.value = originalWidth;
                heightInput.value = originalHeight;
                
                dropZone.style.display = 'none';
                workspace.style.display = 'block';
                resultArea.style.display = 'none';
            };
        };
        
        reader.onerror = () => showError('Failed to read the file.');
        reader.readAsDataURL(file);
    }

    // Remove Image Handler
    removeBtn.addEventListener('click', () => {
        originalImage = new Image();
        originalWidth = 0;
        originalHeight = 0;
        currentFileName = "image";
        resizedDataUrl = "";

        fileInput.value = '';
        widthInput.value = '';
        heightInput.value = '';
        originalPreview.src = '';
        resizedPreview.src = '';
        
        workspace.style.display = 'none';
        resultArea.style.display = 'none';
        errorMessage.style.display = 'none';
        dropZone.style.display = 'block';
    });

    // Reset Values Handler
    resetBtn.addEventListener('click', () => {
        if (originalWidth && originalHeight) {
            widthInput.value = originalWidth;
            heightInput.value = originalHeight;
            resultArea.style.display = 'none';
        }
    });

    // Aspect Ratio Logic
    widthInput.addEventListener('input', () => {
        if (aspectCheckbox.checked && originalWidth > 0) {
            const ratio = originalHeight / originalWidth;
            heightInput.value = Math.round(widthInput.value * ratio) || '';
        }
    });

    heightInput.addEventListener('input', () => {
        if (aspectCheckbox.checked && originalHeight > 0) {
            const ratio = originalWidth / originalHeight;
            widthInput.value = Math.round(heightInput.value * ratio) || '';
        }
    });

    // Format UI Logic
    formatSelect.addEventListener('change', () => {
        if (formatSelect.value === 'image/png') {
            qualityGroup.style.display = 'none';
        } else {
            qualityGroup.style.display = 'block';
        }
    });

    qualitySlider.addEventListener('input', (e) => {
        qualityValue.textContent = e.target.value;
    });

    // Resize Logic
    resizeBtn.addEventListener('click', () => {
        const width = parseInt(widthInput.value);
        const height = parseInt(heightInput.value);

        if (isNaN(width) || isNaN(height) || width <= 0 || height <= 0) {
            showError('Please enter valid, positive numbers for width and height.');
            return;
        }

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        
        if (formatSelect.value !== 'image/jpeg') {
            ctx.clearRect(0, 0, width, height);
        } else {
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, width, height);
        }

        ctx.drawImage(originalImage, 0, 0, width, height);

        const format = formatSelect.value;
        const quality = parseFloat(qualitySlider.value);
        
        resizedDataUrl = canvas.toDataURL(format, quality);
        
        resizedPreview.src = resizedDataUrl;
        resizedDimensions.textContent = `Resized: ${width} × ${height} px`;
        resultArea.style.display = 'block';
        
        resultArea.scrollIntoView({ behavior: 'smooth' });
    });

    // Download Logic
    downloadBtn.addEventListener('click', () => {
        if (!resizedDataUrl) return;
        
        const format = formatSelect.value;
        let ext = 'png';
        if (format === 'image/jpeg') ext = 'jpg';
        if (format === 'image/webp') ext = 'webp';

        const a = document.createElement('a');
        a.href = resizedDataUrl;
        a.download = `${currentFileName}-resized.${ext}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    });
</script>

</body>
</html>
